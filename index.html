<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crown &amp; Skull — Character Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English:ital@0;1&family=Kalam:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Controls (hidden on print) -->
  <div class="controls no-print">
    <button class="ctrl-btn" id="btn-clear">☠ New Character</button>
    <button class="ctrl-btn" id="btn-print">⎙ Print / PDF</button>
    <button class="ctrl-btn" id="btn-export">↓ Export</button>
    <label class="ctrl-btn">↑ Import <input type="file" id="import-file" accept=".json" hidden></label>
  </div>

  <main class="page">
    <div class="sheet">

      <!-- ══════════════════════════════════════
           HEADER
      ══════════════════════════════════════ -->
      <header class="sheet-header">
        <div class="header-fields">
          <div class="hdr-row">
            <label class="hdr-label" for="f-name">Character</label>
            <input class="hdr-input" id="f-name" type="text" data-save="name" autocomplete="off">
          </div>
          <div class="hdr-row">
            <label class="hdr-label" for="f-lineage">Lineage</label>
            <input class="hdr-input" id="f-lineage" type="text" data-save="lineage" autocomplete="off">
          </div>
          <div class="hdr-row">
            <label class="hdr-label" for="f-hometown">Hometown</label>
            <input class="hdr-input" id="f-hometown" type="text" data-save="hometown" autocomplete="off">
          </div>
          <div class="hdr-row">
            <label class="hdr-label" for="f-flaws">Flaws</label>
            <input class="hdr-input" id="f-flaws" type="text" data-save="flaws" autocomplete="off">
          </div>
          <div class="hdr-row">
            <label class="hdr-label" for="f-summa">Summa</label>
            <input class="hdr-input" id="f-summa" type="text" data-save="summa" autocomplete="off">
          </div>
        </div>
        <div class="portrait-box" id="portrait-box" title="Click to upload portrait">
          <img id="portrait-img" alt="">
          <span class="portrait-hint">☽<br>portrait</span>
          <input type="file" id="portrait-upload" accept="image/*" hidden>
        </div>
      </header>

      <!-- ══════════════════════════════════════
           SECTION DIVIDER
      ══════════════════════════════════════ -->
      <div class="section-bar">
        <div class="sec-label left-label">⟵ Equipment ⟶</div>
        <div class="sec-center">
          <div class="crown-icon">♛</div>
        </div>
        <div class="sec-label right-label">⟵ Skills ⟶</div>
        <div class="die-col-spacer"></div>
      </div>

      <!-- ══════════════════════════════════════
           BODY — 10 rows (generated by JS)
      ══════════════════════════════════════ -->
      <div class="body-rows" id="body-rows"></div>

      <!-- ══════════════════════════════════════
           SPELLS
      ══════════════════════════════════════ -->
      <div class="spells-section">
        <div class="spells-bar">⟵ Spells ⟶</div>
        <div class="spell-rows">
          <input class="spell-line" type="text" data-save="spell-0" autocomplete="off">
          <input class="spell-line" type="text" data-save="spell-1" autocomplete="off">
          <input class="spell-line" type="text" data-save="spell-2" autocomplete="off">
        </div>
      </div>

    </div><!-- /sheet -->
  </main>

  <script src="app.js"></script>
</body>
</html>
